services:
  db:
    image: postgres:16.4-alpine
    pull_policy: never
    environment:
      POSTGRES_DB: floww
      POSTGRES_USER: floww
      POSTGRES_PASSWORD: ${FLOWW_DB_PASSWORD:?Set FLOWW_DB_PASSWORD locally}
    ports:
      - "127.0.0.1:${FLOWW_DB_PORT:-55433}:5432"
    volumes:
      - floww_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U floww -d floww"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  floww_pgdata:
