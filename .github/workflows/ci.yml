name: server-ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: floww
          POSTGRES_USER: floww
          POSTGRES_PASSWORD: ci-${{ github.run_id }}
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U floww -d floww"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and run PostgreSQL integration tests
        env:
          FLOWW_DB_PASSWORD: ci-${{ github.run_id }}
          FLOWW_DB_PORT: 55432
        run: ./mvnw -B verify
