<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; form-action 'none'; base-uri 'none'">
  <title>Floww 지갑 로그인</title>
  <link rel="stylesheet" href="/wallet-signin-example/style.css">
</head>
<body>
<main>
  <h1>MetaMask로 로그인</h1>
  <p>MetaMask에서 시작하고, 지원 지갑에서 로그인 메시지에 서명합니다. 로그인은 지출 승인과 별개입니다.</p>
  <label for="provider">지갑 선택</label>
  <select id="provider" aria-label="지갑 선택"></select>
  <button id="connect" type="button">연결하고 로그인</button>
  <button id="retry" type="button" hidden>다시 시도</button>
  <p id="status" role="status" aria-live="polite"></p>
</main>
<script type="module" src="/wallet-signin-example/app.js"></script>
</body>
</html>
