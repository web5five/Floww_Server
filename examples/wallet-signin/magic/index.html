<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Floww · 지갑 로그인</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.mjs"></script>
</head>
<body>
  <main class="shell">
    <header><span class="mark">F</span><span class="brand">floww</span><span class="tag">WALLET ACCESS</span></header>
    <section class="card" aria-labelledby="title">
      <div class="eyebrow"><span class="dot"></span> MAGIC WALLET</div>
      <h1 id="title">이메일로 시작하고,<br><em>지갑으로 확인하세요.</em></h1>
      <p class="intro">이메일 인증 후 지갑에서 로그인 메시지에 서명합니다.</p>
      <form id="signin">
        <label for="email">이메일 주소</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="name@example.com" required>
        <button id="connect" type="submit">Magic으로 로그인 <span aria-hidden="true">↗</span></button>
      </form>
      <p id="status" role="status" aria-live="polite">이메일 주소를 입력해 주세요.</p>
      <div id="session" class="session" hidden>
        <div><small>연결된 지갑</small><strong id="address"></strong></div>
        <button id="disconnect" type="button">로그아웃</button>
      </div>
      <p class="footnote">로그인 서명은 결제 승인이나 지출 권한을 부여하지 않습니다.</p>
    </section>
    <footer>Floww <span>·</span> Secure wallet sign-in</footer>
  </main>
</body>
</html>
