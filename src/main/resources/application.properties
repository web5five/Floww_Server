server.address=${FLOWW_BIND_ADDRESS:127.0.0.1}
server.port=${FLOWW_PORT:8080}
spring.datasource.url=${FLOWW_DB_URL:jdbc:postgresql://127.0.0.1:${FLOWW_DB_PORT:55433}/floww}
spring.datasource.username=${FLOWW_DB_USER:floww}
spring.datasource.password=${FLOWW_DB_PASSWORD}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jackson.deserialization.fail-on-unknown-properties=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
floww.kiln.base-url=${KILN_BASE_URL:https://api.bricksum.com/v1}
floww.kiln.api-key=${KILN_API_KEY:}
floww.merchant.test-base-url=${FLOWW_TEST_MERCHANT_BASE_URL:}
floww.auth.alice-token=${FLOWW_DEV_TOKEN_ALICE:}
floww.auth.bob-token=${FLOWW_DEV_TOKEN_BOB:}
floww.auth.jwt.signing-key=${JWT_SIGNING_KEY:}
floww.cors.allowed-origins=${FLOWW_CORS_ALLOWED_ORIGINS:}
floww.auth.wallet.enabled=${FLOWW_WALLET_SIGNIN_ENABLED:false}
floww.auth.wallet.example-enabled=${FLOWW_WALLET_EXAMPLE_ENABLED:false}
floww.auth.wallet.origin=${FLOWW_WALLET_ORIGIN:}
floww.auth.wallet.chain-ids=${FLOWW_WALLET_CHAIN_IDS:}
# Issue #34/#35: settlement asset for task mandates, quotes and EIP-712 approvals (Sepolia fUSDC by default).
floww.task.chain-id=${FLOWW_TASK_CHAIN_ID:11155111}
floww.task.token-address=${FLOWW_TASK_TOKEN_ADDRESS:0x84B494ff145a545D286321691a9B4Febe6947D6A}
floww.task.token-decimals=${FLOWW_TASK_TOKEN_DECIMALS:6}
# Issue #33: trusted merchant registry recipients. Defaults are keyless demo placeholders, not real payees.
floww.merchant.pharmacy-a.recipient=${FLOWW_PHARMACY_A_RECIPIENT:0x00000000000000000000000000000000f10aa001}
floww.merchant.pharmacy-b.recipient=${FLOWW_PHARMACY_B_RECIPIENT:0x00000000000000000000000000000000f10aa002}
floww.merchant.pharmacy-c.recipient=${FLOWW_PHARMACY_C_RECIPIENT:0x00000000000000000000000000000000f10aa003}
# F031: fail-closed opt-in chain mode. Never set private keys in a public artifact.
floww.taskaccount.enabled=${FLOWW_TASKACCOUNT_ENABLED:false}
floww.taskaccount.rpc-url=${FLOWW_TASKACCOUNT_RPC_URL:}
floww.taskaccount.executor-key=${FLOWW_TASKACCOUNT_EXECUTOR_KEY:}
floww.taskaccount.reporter-key=${FLOWW_TASKACCOUNT_REPORTER_KEY:}
floww.taskaccount.executor-address=${FLOWW_TASKACCOUNT_EXECUTOR_ADDRESS:}
floww.taskaccount.reporter-address=${FLOWW_TASKACCOUNT_REPORTER_ADDRESS:}
