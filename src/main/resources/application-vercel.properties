# Vercel container runtime; the local profile keeps its loopback default.
server.address=0.0.0.0
server.port=${PORT:8080}

# Each scaled container owns a separate Hikari pool. Revisit against the
# actual Supabase project connection limit before increasing this value.
spring.datasource.hikari.maximum-pool-size=${FLOWW_DB_POOL_MAX:2}
spring.datasource.hikari.minimum-idle=0
